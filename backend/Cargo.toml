[package]
name = "backend"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-timers = "1.0"
ic-cdk-management-canister = "0.3"
ic-stable-structures = "0.7"
icrc-ledger-types = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
pocket-ic = "16"
