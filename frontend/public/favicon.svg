<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 96 654 654" role="img" aria-label="Chronolock">
<defs>
  <linearGradient id="cl-shackle" x1="133" y1="0" x2="401" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4a2f93"/><stop offset=".3" stop-color="#3d4ca5"/>
    <stop offset=".55" stop-color="#2b509c"/><stop offset=".8" stop-color="#2377a8"/><stop offset="1" stop-color="#2382af"/>
  </linearGradient>
  <radialGradient id="cl-shackle-hi" cx="267" cy="272" r="164" gradientUnits="userSpaceOnUse">
    <stop offset=".63" stop-color="#000" stop-opacity=".22"/><stop offset=".8" stop-color="#000" stop-opacity="0"/>
    <stop offset=".93" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cl-left" x1="0" y1="300" x2="0" y2="742" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4150ac"/><stop offset=".35" stop-color="#3b3a98"/>
    <stop offset=".7" stop-color="#3b1f7c"/><stop offset="1" stop-color="#371875"/>
  </linearGradient>
  <linearGradient id="cl-right" x1="0" y1="300" x2="0" y2="742" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1a8cb2"/><stop offset=".3" stop-color="#16568c"/>
    <stop offset=".65" stop-color="#192f70"/><stop offset="1" stop-color="#151a5f"/>
  </linearGradient>
  <linearGradient id="cl-glass-l" x1="0" y1="380" x2="0" y2="620" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2a3a92"/><stop offset="1" stop-color="#1c2470"/>
  </linearGradient>
  <linearGradient id="cl-sand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#27e0da"/><stop offset=".5" stop-color="#12ebeb"/><stop offset="1" stop-color="#15ccc6"/>
  </linearGradient>
  <linearGradient id="cl-pile" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#13e7e8"/><stop offset=".6" stop-color="#10d8d2"/><stop offset="1" stop-color="#1e8ca9"/>
  </linearGradient>
  <clipPath id="cl-shield"><path d="M61 330 Q267 262 475 330 L476 432 C472 560 388 664 267 742 C146 664 62 560 61 432 Z"/></clipPath>
  <clipPath id="cl-glass"><path d="M200 382 C200 455 255 470 257 500 C255 530 200 545 200 618 H334 C334 545 279 530 277 500 C279 470 334 455 334 382 Z"/></clipPath>
  <filter id="cl-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- shackle -->
<path d="M133 340 V272 A134 134 0 0 1 401 272 V340" fill="none" stroke="url(#cl-shackle)" stroke-width="60"/>
<path d="M133 340 V272 A134 134 0 0 1 401 272 V340" fill="none" stroke="url(#cl-shackle-hi)" stroke-width="60"/>

<!-- shield: violet left half, teal-blue right half -->
<g clip-path="url(#cl-shield)">
  <rect x="40" y="250" width="230" height="510" fill="url(#cl-left)"/>
  <rect x="270" y="250" width="250" height="510" fill="url(#cl-right)"/>
  <g clip-path="inset(0 0 0 0)"></g>
  <path d="M270 250 V760" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
</g>
<path d="M61 330 Q267 262 475 330" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

<!-- hourglass -->
<g clip-path="url(#cl-glass)">
  <rect x="190" y="370" width="77" height="260" fill="url(#cl-glass-l)"/>
  <rect x="267" y="370" width="80" height="260" fill="#1a3274"/>
  <path d="M214 438 H320 C312 458 284 474 270 496 H264 C250 474 222 458 214 438 Z" fill="url(#cl-sand)"/>
  <path d="M265 498 V578" stroke="#12ebeb" stroke-width="5"/>
  <path d="M205 618 C222 596 248 578 267 574 C286 578 312 596 329 618 Z" fill="url(#cl-pile)"/>
</g>
<g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
  <path d="M200 382 C200 455 255 470 257 500 C255 530 200 545 200 618"/>
  <path d="M334 382 C334 455 279 470 277 500 C279 530 334 545 334 618"/>
</g>
<g fill="#ffffff">
  <rect x="170" y="364" width="194" height="20" rx="8"/>
  <rect x="170" y="616" width="194" height="20" rx="8"/>
</g>
</svg>
