name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install icp-cli
        run: npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm
      - name: Backend unit tests
        run: cargo test -p backend --lib
      - name: Build all canisters
        run: icp build
      - name: Frontend tests
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend test
      - name: End-to-end tests on a local network
        run: |
          icp network start -d
          icp deploy --identity anonymous
          ICP_E2E=1 pnpm --dir frontend exec vitest run tests/e2e.local.test.ts
